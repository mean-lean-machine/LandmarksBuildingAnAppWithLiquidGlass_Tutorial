# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/reference/configuration-reference
version: 2.1

# Define a job to be invoked later in a workflow.
# See: https://circleci.com/docs/guides/orchestrate/jobs-steps/#jobs-overview & https://circleci.com/docs/reference/configuration-reference/#jobs
orbs:
  node: circleci/node@7.2.1
  slack: circleci/slack@6.1.3
jobs:
  build:
    macos:
      xcode: 26.6.0
    resource_class: macos.m1.medium.gen1
    steps:
      - checkout
      - node/install:
          node-version: "20.19"
      - run:
          name: Run tests
          working_directory: Landmarks
          command: |
            xcodebuild test \
              -project Landmarks.xcodeproj \
              -scheme Landmarks \
              -destination 'platform=iOS Simulator,name=iPhone 17' \
              -resultBundlePath TestResults.xcresult
      - run:
          name: Generate Allure report
          working_directory: Landmarks
          when: always
          command: npx --yes allure generate TestResults.xcresult --output allure-report
      - store_artifacts:
          path: Landmarks/allure-report
          destination: allure-report
      - store_artifacts:
          path: Landmarks/TestResults.xcresult
          destination: xcresult
      - run:
          name: Prepare Slack notification
          working_directory: Landmarks
          when: always
          command: |
            command -v jq >/dev/null 2>&1 || brew install jq

            SUMMARY=$(xcrun xcresulttool get test-results summary --path TestResults.xcresult --format json 2>/dev/null || echo '{}')
            ALLURE_URL="https://output.circle-artifacts.com/output/job/${CIRCLE_WORKFLOW_JOB_ID}/artifacts/0/allure-report/index.html"

            echo "$SUMMARY" | jq \
              --arg allure_url "$ALLURE_URL" \
              --arg build_url "$CIRCLE_BUILD_URL" \
              --arg branch "$CIRCLE_BRANCH" \
              --arg project "$CIRCLE_PROJECT_REPONAME" \
              '{
                blocks: [
                  {
                    type: "header",
                    text: {
                      type: "plain_text",
                      text: ((if ((.failedTests // 0) | tostring) == "0" then "✅ " else "❌ " end) + $project + " tests — " + $branch)
                    }
                  },
                  {
                    type: "section",
                    fields: [
                      { type: "mrkdwn", text: ("*Total:* " + ((.totalTestCount // "n/a") | tostring)) },
                      { type: "mrkdwn", text: ("*Passed:* " + ((.passedTests // "n/a") | tostring)) },
                      { type: "mrkdwn", text: ("*Failed:* " + ((.failedTests // "n/a") | tostring)) },
                      { type: "mrkdwn", text: ("*Skipped:* " + ((.skippedTests // "n/a") | tostring)) }
                    ]
                  },
                  {
                    type: "section",
                    text: { type: "mrkdwn", text: ("<" + $allure_url + "|View Allure report>  •  <" + $build_url + "|CircleCI build>") }
                  }
                ]
              }' > /tmp/slack_template.json

            echo 'export SLACK_CUSTOM_TEMPLATE=$(cat /tmp/slack_template.json)' >> "$BASH_ENV"
      # Notify Slack with a test-results summary and a link to the Allure report
      - slack/notify:
          event: fail
          custom: ${SLACK_CUSTOM_TEMPLATE}
          channel: C0AMCCK29CY # Use channel ID, not name
      - slack/notify:
          channel: C0AMCCK29CY
          event: pass
          custom: ${SLACK_CUSTOM_TEMPLATE}

workflows:
  main:
    jobs:
      - build



