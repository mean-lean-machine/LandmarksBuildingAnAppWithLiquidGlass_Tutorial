# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/reference/configuration-reference
version: 2.1

# Define a job to be invoked later in a workflow.
# See: https://circleci.com/docs/guides/orchestrate/jobs-steps/#jobs-overview & https://circleci.com/docs/reference/configuration-reference/#jobs
orbs:
  node: circleci/node@7.2.1
  slack: circleci/slack@6.1.3
jobs:
  build:
    macos:
      xcode: 26.6.0
    resource_class: macos.m1.medium.gen1
    steps:
      - checkout
      - node/install:
          node-version: "20.19"
      - run:
          name: Run tests
          working_directory: Landmarks
          command: |
            xcodebuild test \
              -project Landmarks.xcodeproj \
              -scheme Landmarks \
              -destination 'platform=iOS Simulator,name=iPhone 17' \
              -resultBundlePath TestResults.xcresult
      - run:
          name: Generate Allure report
          working_directory: Landmarks
          when: always
          command: npx --yes allure generate TestResults.xcresult --output allure-report --clean
      - store_artifacts:
          path: Landmarks/allure-report
          destination: allure-report
      - store_artifacts:
          path: Landmarks/TestResults.xcresult
          destination: xcresult
      # Notify Slack if the build fails/succeeds
      - slack/notify:
          event: fail
          template: basic_fail_1
          channel: C0AMCCK29CY # Use channel ID, not name
      - slack/notify:
          channel: C0AMCCK29CY
          event: pass
          template: success_tagged_deploy_1

workflows:
  main:
    jobs:
      - build



